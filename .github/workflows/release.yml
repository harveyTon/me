name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: me-${{ github.ref_name }}-macos-arm64.tar.gz
            use_cross: false
            force_cross: false
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: me-${{ github.ref_name }}-macos-x64.tar.gz
            use_cross: false
            force_cross: false
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: me-${{ github.ref_name }}-linux-x64.tar.gz
            use_cross: true
            force_cross: true
          - name: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: me-${{ github.ref_name }}-linux-arm64.tar.gz
            use_cross: true
            force_cross: false
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: me-${{ github.ref_name }}-windows-x64.zip
            use_cross: false
            force_cross: false
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: me-${{ github.ref_name }}-windows-arm64.zip
            use_cross: false
            force_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --locked

      - name: Test
        run: cargo test --locked

      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ME_FORCE_CROSS: ${{ matrix.force_cross && '1' || '0' }}
        run: scripts/build.sh "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          for file in *; do
            sha256sum "$file"
          done > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi

          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
