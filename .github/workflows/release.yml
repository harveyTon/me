name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: me-${{ github.ref_name }}-macos-arm64.tar.gz
            use_cross: false
            force_cross: false
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: me-${{ github.ref_name }}-macos-x64.tar.gz
            use_cross: false
            force_cross: false
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: me-${{ github.ref_name }}-linux-x64.tar.gz
            use_cross: true
            force_cross: true
          - name: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: me-${{ github.ref_name }}-linux-arm64.tar.gz
            use_cross: true
            force_cross: false
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: me-${{ github.ref_name }}-windows-x64.zip
            use_cross: false
            force_cross: false
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: me-${{ github.ref_name }}-windows-arm64.zip
            use_cross: false
            force_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --locked

      - name: Test
        run: cargo test --locked

      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ME_FORCE_CROSS: ${{ matrix.force_cross && '1' || '0' }}
        run: scripts/build.sh "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          for file in *; do
            sha256sum "$file"
          done > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi

          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    continue-on-error: true

    steps:
      - name: Check Homebrew tap token
        id: tap-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update"
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout tap
        if: steps.tap-token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: harveyTon/homebrew-me
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-me

      - name: Update formula
        if: steps.tap-token.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          source_url="https://github.com/harveyTon/me/archive/refs/tags/${version}.tar.gz"
          source_sha="$(curl -fsSL "${source_url}" | sha256sum | awk '{print $1}')"
          release_json="$(gh release view "${version}" --repo "${GITHUB_REPOSITORY}" --json assets)"

          asset_sha() {
            local asset_name="$1"
            jq -r --arg name "${asset_name}" '
              .assets[]
              | select(.name == $name)
              | .digest
              | sub("^sha256:"; "")
            ' <<<"${release_json}"
          }

          macos_arm64_asset="me-${version}-macos-arm64.tar.gz"
          macos_x64_asset="me-${version}-macos-x64.tar.gz"
          linux_arm64_asset="me-${version}-linux-arm64.tar.gz"
          linux_x64_asset="me-${version}-linux-x64.tar.gz"

          macos_arm64_sha="$(asset_sha "${macos_arm64_asset}")"
          macos_x64_sha="$(asset_sha "${macos_x64_asset}")"
          linux_arm64_sha="$(asset_sha "${linux_arm64_asset}")"
          linux_x64_sha="$(asset_sha "${linux_x64_asset}")"

          for value in \
            "${macos_arm64_sha}" \
            "${macos_x64_sha}" \
            "${linux_arm64_sha}" \
            "${linux_x64_sha}"; do
            [[ -n "${value}" && "${value}" != "null" ]] || {
              echo "missing prebuilt archive digest in GitHub release metadata" >&2
              exit 1
            }
          done

          cd homebrew-me

          cat > Formula/me.rb <<EOF
          class Me < Formula
            desc "A modern, context-aware replacement for whoami"
            homepage "https://github.com/harveyTon/me"
            url "${source_url}"
            sha256 "${source_sha}"
            license "MIT"

            if OS.mac?
              if Hardware::CPU.arm?
                resource "me-binary" do
                  url "https://github.com/harveyTon/me/releases/download/${version}/${macos_arm64_asset}"
                  sha256 "${macos_arm64_sha}"
                end
              elsif Hardware::CPU.intel?
                resource "me-binary" do
                  url "https://github.com/harveyTon/me/releases/download/${version}/${macos_x64_asset}"
                  sha256 "${macos_x64_sha}"
                end
              else
                depends_on "rust" => :build
              end
            elsif OS.linux?
              if Hardware::CPU.arm?
                resource "me-binary" do
                  url "https://github.com/harveyTon/me/releases/download/${version}/${linux_arm64_asset}"
                  sha256 "${linux_arm64_sha}"
                end
              elsif Hardware::CPU.intel?
                resource "me-binary" do
                  url "https://github.com/harveyTon/me/releases/download/${version}/${linux_x64_asset}"
                  sha256 "${linux_x64_sha}"
                end
              else
                depends_on "rust" => :build
              end
            else
              depends_on "rust" => :build
            end

            def install
              if prebuilt_binary_available?
                resource("me-binary").stage do
                  bin.install "me"
                end
              else
                system "cargo", "install", *std_cargo_args
              end

              man1.install "man/man1/me.1"
            end

            private

            def prebuilt_binary_available?
              (OS.mac? || OS.linux?) && (Hardware::CPU.arm? || Hardware::CPU.intel?)
            end
          end
          EOF

          ruby -c Formula/me.rb

          if git diff --quiet; then
            echo "Formula already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/me.rb
          git commit -m "Update me formula to ${version}"
          git push
