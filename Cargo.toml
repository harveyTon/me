[package]
name = "me"
version = "0.4.0"
edition = "2024"
description = "A modern, context-aware replacement for whoami"
license = "MIT"
repository = "https://github.com/harveyTon/me"
homepage = "https://github.com/harveyTon/me"
readme = "README.md"
keywords = ["cli", "whoami", "identity", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
hostname = "0.4"
is-terminal = "0.4"
libc = "0.2"
local-ip-address = "0.6"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
